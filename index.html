<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
  
  <title>Frontend Mentor | Blog preview card</title>

</head>
<body>

  <main>
    <article class="card">
      <header>
        <img class="card-image" src="/assets/images/illustration-article.svg" alt="Illustration for the article">
      </header>
      <section>
        <p class="card-tag">Learning</p>

        <p class="card-date">Published <time datetime="2023-12-21">21 Dec 2023</time></p>

        <h1 class="card-title">HTML & CSS foundations</h1>

        <p class="card-description">These languages are the backbone of every website, defining structure, content and presentation</p>
        </section>
      <footer>
        <div class="author-info">
          <img class="author-image" src="/assets/images/image-avatar.webp" alt="Greg Hooper">

          <p class="author-name">Greg Hooper</p>
        </div>
      </footer>
    </article>
  </main>
  
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Aishah</a>.
  </footer>
</body>
</html>
